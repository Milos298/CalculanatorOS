name: Build CalculanatorOS bootable ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CalculanatorOS.py'
      - 'desktop/CalculanatorOS.py'
      - 'boot-image/**'
      - '.github/workflows/build-calculanatoros-iso.yml'

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build bootable ISO in Debian Trixie
        run: |
          docker run --rm --privileged \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            debian:trixie \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools
              bash ./boot-image/build-iso.sh
            '

      - name: Publish ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalculanatorOS-live-amd64
          path: |
            dist/CalculanatorOS-live-amd64.iso
            dist/CalculanatorOS-live-amd64.iso.sha256
          if-no-files-found: error
